[workspace]
resolver = "2"
members = ["token", "campaign", "factory"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
repository = "https://github.com/your-org/crowdfundx"

[workspace.dependencies]
soroban-sdk = "27.0.6"

# Production wasm profile: tiny, no debug info, abort on panic.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
